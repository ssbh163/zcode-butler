<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 侧边栏插件 · 1:1 复刻原型</title>
<style>
  /* ─── tokens(取自参考图逐点取样)────────────────────────────── */
  :root {
    --panel:        #030303;   /* 面板 / 气泡黑 */
    --ring-track:   #2e2e2e;   /* 圆环轨道 */
    --arc-claude:   #ce6a47;   /* Claude 橙 */
    --arc-openai:   #7fdca9;   /* OpenAI 绿 */
    --arc-perplexity: #eef67e; /* Perplexity 黄 */
    --icon:         #f5f5f5;   /* 图标白 */
    --label:        #e2e2e2;   /* 百分比文字 */
    --gear:         #ececec;   /* 齿轮白 */

    /* 壁纸渐变色标(模糊紫粉壁纸) */
    --wall-base:    #a9a29e;
    --wall-pink-tl: #bc939b;
    --wall-lilac:   #be9bc3;
    --wall-peri:    #9fa0da;
    --wall-pink-l:  #c798a4;
    --wall-salmon:  #b08676;
    --wall-mauve:   #bba1a3;
    --wall-gray-b:  #aba3a1;
    --wall-gray-br: #b0acad;

    --font-ui: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system,
               'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: transparent;   /* 悬浮窗:面板外月牙空隙透出桌面(WebView2 透明) */
    font-family: var(--font-ui);
    overflow: hidden;
  }

  .viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  /* ─── 手机舞台:逻辑坐标 = 参考图像素,底部加长容纳第四环(430 × 2025)──
     悬浮窗模式:贴窗口右缘(fit 按窗口高等比缩放);壁纸移除,由面板黑与空隙透出构成 ── */
  .stage {
    position: absolute;
    right: 0; top: 0;
    transform-origin: 100% 0;
    width: 430px;
    height: 2025px;
    flex: none;
    overflow: hidden;
    background: transparent;
  }

  /* ─── 展开态:贴边面板(形状由实测轮廓点平滑生成)──────────────
     面板常驻固定,不参与滑入 / 滑出切换 */
  .panel-wrap {
    position: absolute; inset: 0;
  }

  .panel-svg { position: absolute; inset: 0; display: block; }

  /* ─── 圆环计量组 ─────────────────────────────────────────────── */
  .meter {
    position: absolute;
    left: 265.5px;              /* 环外沿左缘 = 333 - 67.5 */
    width: 135px; height: 135px;
  }
  .meter svg.ring { position: absolute; inset: 0; }
  .meter .ring-track { stroke: var(--ring-track); }
  .meter .ring-arc   { stroke-linecap: round; }
  .glyph {
    position: absolute;
    left: 50%; top: 50%;
    translate: -50% -50%;
    color: var(--icon);
    line-height: 1;
    font-weight: 600;
    letter-spacing: 0.01em;
    user-select: none;
  }
  .meter .glyph { font-size: 42px; }

  .meter .pct {
    position: absolute;
    top: 167px; left: -30px; right: -30px;
    text-align: center;
    font-size: 44px;
    line-height: 44px;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--label);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  /* ─── 高峰期光晕:工作日 14:00–18:00 围绕 5h 环的橙色辉光 ─────────
     环带渐变峰值对准圆环轨道(r61/光晕半径105 ≈ 58%),呼吸脉动 2.6s */
  .peak-halo {
    position: absolute;
    left: 50%; top: 50%;
    width: 210px; height: 210px;
    translate: -50% -50%;
    border-radius: 50%;
    background: radial-gradient(closest-side,
      rgba(224, 116, 66, 0)    0%,
      rgba(224, 116, 66, 0)    48%,
      rgba(224, 116, 66, 0.62) 58%,
      rgba(224, 116, 66, 0.28) 67%,
      rgba(224, 116, 66, 0)    78%);
    filter: blur(6px);
    opacity: 0;
    transition: opacity 0.9s ease;
    pointer-events: none;
  }
  body.peak-live .peak-halo {
    opacity: 1;
    animation: peak-pulse 2.6s ease-in-out infinite;
  }
  body.peak-live .meter-5h .ring {
    filter: drop-shadow(0 0 9px rgba(224, 116, 66, 0.5));
  }
  @keyframes peak-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  /* ─── 悬停判定区:与按钮同心的圆,仅弧形按钮自身范围触发过渡 ───── */
  .fab-zone {
    position: absolute;
    left: 233px; top: 1591px;     /* 圆心 = 弧线/气泡同心圆心 (317,1675),r 84 */
    width: 168px; height: 168px;
    border-radius: 50%;
    z-index: 4;
  }

  /* ─── 悬浮设置钮:默认 = 细弧线(参考图实测迁移),悬停 = 齿轮气泡 ──
      弧线与气泡同心;悬停时弧线顺势收进气泡绽开 */
  .fab {
    position: absolute;
    left: -12.5px; top: -13px;     /* 相对判定区 = 舞台 (220.5,1578),SVG 圆心 (96.5,97) */
    width: 193px; height: 193px;
  }
  .fab svg {
    position: absolute; inset: 0;
    display: block; overflow: visible;
  }
  .fab .disc {
    opacity: 0;
    transform: scale(0.55);
    transform-origin: 96.5px 97px;
    transition: transform 0.34s cubic-bezier(0.55, 0.055, 0.675, 0.19),
                opacity 0.26s ease-in;
  }
  .fab .arc {
    fill: none;
    stroke: var(--panel);
    stroke-width: 22.3;
    stroke-linecap: round;
    opacity: 1;
    transform: rotate(0deg) scale(1);
    transform-origin: 96.5px 97px;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.24s ease-out;
  }
  /* 悬停 / 键盘聚焦:弧线顺势收走,气泡以 expo-out 绽开 */
  .fab-zone:hover .disc,
  .fab-zone:focus-within .disc {
    opacity: 1;
    transform: scale(1);
    transition: transform 0.44s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.28s ease-out;
  }
  .fab-zone:hover .arc,
  .fab-zone:focus-within .arc {
    opacity: 0;
    transform: rotate(-48deg) scale(0.72);
    transition: transform 0.26s cubic-bezier(0.55, 0.055, 0.675, 0.19),
                opacity 0.2s ease-in;
  }
  .fab .gear-g {
    transform-origin: 96.5px 97px;
    transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .gear-body {
    fill: none;
    stroke: var(--gear);
    stroke-width: 8;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .fab-hit {
    position: absolute;
    left: 20px; top: 20.5px;
    width: 153px; height: 153px;
    border: 0; padding: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .fab-hit:focus-visible {
    outline: 2px solid rgba(3, 3, 3, 0.75);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .fab .disc, .fab .arc, .fab .gear-g { transition: none; }
    body.peak-live .peak-halo { animation: none; }
  }
</style>
</head>
<body>
<main class="viewport">
  <div class="stage" id="stage" data-od-id="phone-stage">

    <div class="panel-wrap" id="panelWrap" data-od-id="sidebar-panel">
      <svg class="panel-svg" width="430" height="2025" viewBox="0 0 430 2025" aria-hidden="true">
        <path id="panelPath" fill="var(--panel)" d=""/>
      </svg>

      <!-- 5h · 73% · 高峰期(工作日 14–18 点)带橙色光晕 -->
      <div class="meter meter-5h" style="top: 330.5px;" data-od-id="meter-5h">
        <div class="peak-halo" data-od-id="peak-halo-5h" aria-hidden="true"></div>
        <svg class="ring" viewBox="0 0 135 135" width="135" height="135" aria-hidden="true">
          <circle class="ring-track" cx="67.5" cy="67.5" r="61" fill="none" stroke-width="13"/>
          <circle class="ring-arc" cx="67.5" cy="67.5" r="61" fill="none" stroke-width="13"
                  stroke="var(--arc-claude)" transform="rotate(-90 67.5 67.5)"
                  stroke-dasharray="279.8 103.5"/>
        </svg>
        <span class="glyph" data-od-id="glyph-5h">5h</span>
        <div class="pct">73%</div>
      </div>

      <!-- 7d · 21% -->
      <div class="meter" style="top: 652px;" data-od-id="meter-7d">
        <svg class="ring" viewBox="0 0 135 135" width="135" height="135" aria-hidden="true">
          <circle class="ring-track" cx="67.5" cy="67.5" r="61" fill="none" stroke-width="13"/>
          <circle class="ring-arc" cx="67.5" cy="67.5" r="61" fill="none" stroke-width="13"
                  stroke="var(--arc-openai)" transform="rotate(-90 67.5 67.5)"
                  stroke-dasharray="80.5 302.8"/>
        </svg>
        <span class="glyph" data-od-id="glyph-7d">7d</span>
        <div class="pct">21%</div>
      </div>

      <!-- MCP · 52% -->
      <div class="meter" style="top: 973.5px;" data-od-id="meter-mcp">
        <svg class="ring" viewBox="0 0 135 135" width="135" height="135" aria-hidden="true">
          <circle class="ring-track" cx="67.5" cy="67.5" r="61" fill="none" stroke-width="13"/>
          <circle class="ring-arc" cx="67.5" cy="67.5" r="61" fill="none" stroke-width="13"
                  stroke="var(--arc-perplexity)" transform="rotate(-90 67.5 67.5)"
                  stroke-dasharray="199.3 184"/>
        </svg>
        <span class="glyph" data-od-id="glyph-mcp">mcp</span>
        <div class="pct">52%</div>
      </div>

      <!-- Key 显示环:第四环,与前三环同尺寸同间距(中心距 321.5)-->
      <div class="meter" style="top: 1295px;" data-od-id="meter-key">
        <svg class="ring" viewBox="0 0 135 135" width="135" height="135" aria-hidden="true">
          <circle class="ring-track" cx="67.5" cy="67.5" r="61" fill="none" stroke-width="13"/>
          <circle class="ring-arc" cx="67.5" cy="67.5" r="61" fill="none" stroke-width="13"
                  stroke="var(--label)"/>
        </svg>
        <span class="glyph" data-od-id="glyph-key">key</span>
        <div class="pct">0/5</div>
      </div>
    </div>

    <!-- 悬停判定区:圆形,仅覆盖弧形按钮自身;移入过渡为齿轮气泡 -->
    <div class="fab-zone" id="fabZone" data-od-id="fab-hover-zone">
      <div class="fab" data-od-id="fab-button">
        <svg viewBox="0 0 193 193" width="193" height="193" aria-hidden="true">
          <g class="disc" data-od-id="fab-disc">
            <circle cx="96.5" cy="97" r="76.5" fill="var(--panel)"/>
            <g class="gear-g" id="gearG">
              <path class="gear-body" id="gearPath" d=""/>
              <circle class="gear-body" cx="96.5" cy="97" r="14"/>
            </g>
          </g>
          <path class="arc" id="arcPath" data-od-id="fab-arc" d=""/>
        </svg>
        <button class="fab-hit" id="gearBtn" data-od-id="settings-button"
                aria-label="设置" title="设置"></button>
      </div>
    </div>

  </div>
</main>

<script>
  /* ── 面板轮廓:实测形态,全链 7px 等弧长重采样(尖端 5 点锚定),
       Catmull-Rom 过冲 ≤0.5px;左缘直线段统一 x=219.2 严格垂直,
       底端直线延至 y≈1475 后以 smoothstep 斜率单调渐入主弧
       (切向/曲率连续,y=1522.8 与实测弧线严格衔接,不过早外扩) ── */

    [219.2,706.2],[219.2,713.2],[219.2,720.2],[219.2,727.2],[219.2,734.2],
    [219.2,741.2],[219.2,748.2],[219.2,755.2],[219.2,762.2],[219.2,769.2],
    [219.2,776.1],[219.2,783.1],[219.2,790.1],[219.2,797.1],[219.2,804.1],
    [219.2,811.1],[219.2,818.1],[219.2,825.1],[219.2,832.1],[219.2,839.1],
    [219.2,846.1],[219.2,853.1],[219.2,860.1],[219.2,867.1],[219.2,874.0],
    [219.2,881.0],[219.2,888.0],[219.2,895.0],[219.2,902.0],[219.2,909.0],
    [219.2,916.0],[219.2,923.0],[219.2,930.0],[219.2,937.0],[219.2,944.0],

    [219.2,985.9],[219.2,992.9],[219.2,999.9],[219.2,1006.9],[219.2,1013.9],
    [219.2,1020.9],[219.2,1027.9],[219.2,1034.9],[219.2,1041.9],[219.2,1048.9],
    [219.2,1055.8],[219.2,1062.8],[219.2,1069.8],[219.2,1076.8],[219.2,1083.8],

    [219.2,1125.8],[219.2,1132.8],[219.2,1139.8],[219.2,1146.8],[219.2,1153.7],
    [219.2,1160.7],[219.2,1167.7],[219.2,1174.7],[219.2,1181.7],[219.2,1188.7],

    [418.3,1639.1],[420.6,1645.7],[424.0,1655.0],[424.0,1659.0],[431.0,1660.0]
  ];
  function smoothPath(pts) {
    var d = 'M' + pts[0][0] + ',' + pts[0][1];
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[Math.max(0, i - 1)], p1 = pts[i],
          p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += 'C' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' +
           c2x.toFixed(1) + ',' + c2y.toFixed(1) + ' ' + p2[0] + ',' + p2[1];
    }
    return d + 'Z';
  }
  document.getElementById('panelPath').setAttribute('d', smoothPath(outline));

  /* ── 六齿圆角齿轮(与参考图一致,中心 = 气泡圆心 96.5,97)──────── */
  var GCX = 96.5, GCY = 97;
  function gearPath(teeth, r0, amp, sharp) {
    var k = Math.tanh(sharp), pts = [];
    for (var a = 0; a < 360; a += 1.5) {
      var rad = a * Math.PI / 180;
      var m = Math.tanh(sharp * Math.cos(teeth * rad)) / k;
      var r = r0 + amp * m;
      pts.push((GCX + r * Math.cos(rad)).toFixed(2) + ',' + (GCY + r * Math.sin(rad)).toFixed(2));
    }
    return 'M' + pts.join('L') + 'Z';
  }
  document.getElementById('gearPath').setAttribute('d', gearPath(6, 33, 7.5, 2.2));

  /* ── 舞台适配:悬浮窗按窗口高等比缩放,贴右缘(css: right 0 / origin 100% 0)── */
  var stage = document.getElementById('stage');
  function fit() {
    var s = window.innerHeight / 2025;
    if (!isFinite(s) || s <= 0) s = 0.385;
    stage.style.transformOrigin = '100% 0';
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fit, { passive: true });
  }
  window.addEventListener('orientationchange', fit);
  window.addEventListener('load', fit);
  [100, 400, 1000, 2500].forEach(function (t) { setTimeout(fit, t); });
  fit();

  /* ── 细弧线默认态(实拍实测:同心 (96.5,97) · R 69.7 · 描边 22.3 ·
       Painted 242.4°→4.6°,与面板底缘保持 26–28px 均匀壁纸通道,
       下端收在底尖旁,上端沿搁架下方掠过)────────────────────────── */
  (function () {
    var cx = 96.5, cy = 97, r = 69.7;
    var a0 = 251.5 * Math.PI / 180, a1 = -4.5 * Math.PI / 180;
    var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    var x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    document.getElementById('arcPath').setAttribute('d',
      'M' + x0.toFixed(1) + ',' + y0.toFixed(1) +
      ' A' + r + ',' + r + ' 0 0 1 ' + x1.toFixed(1) + ',' + y1.toFixed(1));
  })();

  /* ── 弧线 ↔ 气泡的过渡由 CSS(:hover / :focus-within)完成;
     点击齿轮仅作旋转反馈 ─────────────────────────────────────────── */
  var gearG = document.getElementById('gearG');
  var spinDeg = 0;
  document.getElementById('gearBtn').addEventListener('click', function () {
    spinDeg += 180;   /* 每次点击顺时针转半圈 */
    gearG.style.transform = 'rotate(' + spinDeg + 'deg)';
  });

  /* ── 高峰期判定:周一至周五 14:00–18:00 点亮 5h 环光晕;
      URL 加 ?peak=1(或 #peak)可在任意时间预览发光态 ─────────────── */
  var FORCE_PEAK_FOR_PREVIEW = false;   /* 渲染核验用,默认关闭 */
  (function () {
    function isPeakNow() {
      var d = new Date(), day = d.getDay(), h = d.getHours();
      return day >= 1 && day <= 5 && h >= 14 && h < 18;
    }
    function apply() {
      var forced = /[?&]peak=1/.test(location.search) || /peak/.test(location.hash);
      document.body.classList.toggle('peak-live',
        FORCE_PEAK_FOR_PREVIEW || forced || isPeakNow());
    }
    apply();
    setInterval(apply, 60000);
  })();

  /* ── 数据桥:宿主(WebView2 壳)PostWebMessageAsJson → 四环 + Key ──
      协议 = status.mjs --json:account.fiveHour/weekly/mcpMonthly.pct + keys[](pct 降序)。
      浏览器直开(无宿主)时沿用演示数据,便于调 UI。 */
  var RING_C = 2 * Math.PI * 61;   /* 383.27,与参考图一致 */
  function butlerSetRing(odId, pct, hasData) {
    var meter = document.querySelector('[data-od-id="meter-' + odId + '"]');
    if (!meter) return;
    var arc = meter.querySelector('.ring-arc');
    var pctEl = meter.querySelector('.pct');
    if (!hasData || pct == null) {
      arc.setAttribute('stroke-dasharray', '0 ' + RING_C.toFixed(1));
      pctEl.textContent = '—';
      return;
    }
    var p = Math.max(0, Math.min(100, Number(pct) || 0));
    arc.setAttribute('stroke-dasharray',
      (RING_C * p / 100).toFixed(1) + ' ' + (RING_C * (1 - p / 100)).toFixed(1));
    pctEl.textContent = Math.round(p) + '%';
  }
  function butlerApply(d) {
    if (!d) return;
    var a = d.account || {};
    butlerSetRing('5h',  a.fiveHour    ? a.fiveHour.pct    : null, !!a.fiveHour);
    butlerSetRing('7d',  a.weekly      ? a.weekly.pct      : null, !!a.weekly);
    butlerSetRing('mcp', a.mcpMonthly  ? a.mcpMonthly.pct  : null, !!a.mcpMonthly);
    /* Key 环 = 用量最高那把(pct 降序取第 1);未配置 Key 显示 — */
    var keys = (d.keys || []).filter(function (k) { return k.status !== 'error'; });
    var top = keys.length ? keys[0] : null;
    butlerSetRing('key', top ? top.pct : null, !!top);
  }
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', function (e) {
      try {
        var msg = e.data;
        if (msg && msg.type === 'data') butlerApply(msg.payload);
      } catch (err) { }
    });
    window.chrome.webview.postMessage('{"type":"ready"}');
    /* 拖动桥:WebView 吃掉 WPF 鼠标事件,面板拖动 = 页面 pointerdown → 宿主 DragMove;
       fab-zone 除外(齿轮按钮自有悬停/点击交互) */
    document.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      if (e.target.closest && e.target.closest('.fab-zone')) return;
      try { window.chrome.webview.postMessage('drag'); } catch (err) { }
    });
    /* 形状上报:布局落定后把面板轮廓/fab 圆映射到视口坐标发给宿主,
       供宿主 WM_NCHITTEST 命中掩码使用(合成宿主下渲染与命中分离,边缘 AA 保真) */
    function butlerReportShape() {
      var stage = document.querySelector('.stage');
      var panel = document.getElementById('panelPath');
      if (!stage || !panel) return;
      var sr = stage.getBoundingClientRect();
      var kx = sr.width / 430, ky = sr.height / 2025;
      /* 胶囊轮廓:沿实际渲染的平滑路径每 4 舞台px 重采样(非 250 点折线)——
         rgn 紧贴曲线,高对比背景下边缘台阶最小化 */
      var PL = panel.getTotalLength(), caps = [], d, pp;
      for (d = 0; d <= PL; d += 4) {
        pp = panel.getPointAtLength(d);
        caps.push([sr.left + pp.x * kx, sr.top + pp.y * ky]);
      }
      /* 三桥铁律:桥内零设计坐标常量——fab 视口映射(.fab rect+viewBox)、
         描边宽(computed style)、命中圆(.fab-zone rect)全部运行时实测,
         挪动/缩放 fab 或改描宽后掩码自动跟随,合入无需回填锚点 */
      var band = null, arcCaps = null, bandR = 0, fabC = null, fabR = 0;
      var arc = document.getElementById('arcPath');
      if (arc && arc.getTotalLength) {
        var L = arc.getTotalLength();
        if (L > 0) {
          var fabBox = document.querySelector('.fab'),
              fbR = fabBox ? fabBox.getBoundingClientRect() : null,
              fvb = (arc.ownerSVGElement && arc.ownerSVGElement.viewBox) ? arc.ownerSVGElement.viewBox.baseVal : null,
              fu = (fbR && fvb && fvb.width) ? fbR.width / fvb.width : 1;
          var mapF = function (v) {
            return fbR ? [fbR.left + v[0] * fu, fbR.top + v[1] * fu] : [v[0], v[1]];
          };
          var sw = parseFloat(getComputedStyle(arc).strokeWidth) || 0;
          var half = sw / 2 + 2.5, outer = [], inner = [], i, t, p, q, dx, dy, ln, nx, ny;
          for (i = 0; i <= 64; i++) {
            t = L * i / 64;
            p = arc.getPointAtLength(t);
            q = arc.getPointAtLength(Math.min(L, t + 0.5));
            dx = q.x - p.x; dy = q.y - p.y; ln = Math.hypot(dx, dy) || 1;
            nx = -dy / ln; ny = dx / ln;
            outer.push([p.x + nx * half, p.y + ny * half]);
            inner.push([p.x - nx * half, p.y - ny * half]);
          }
          var p0 = arc.getPointAtLength(0), p1 = arc.getPointAtLength(L);
          band = outer.concat(inner.reverse()).map(mapF);
          arcCaps = [mapF([p0.x, p0.y]), mapF([p1.x, p1.y])];
          bandR = half * fu;
          var fabZone = document.querySelector('.fab-zone');
          if (fabZone) {
            var fz = fabZone.getBoundingClientRect();
            fabC = [(fz.left + fz.right) / 2, (fz.top + fz.bottom) / 2];
            fabR = Math.min(fz.width, fz.height) / 2;
          }
        }
      }
      try {
        var pb = panel.getBoundingClientRect(), ab = arc ? arc.getBoundingClientRect() : null;
        window.chrome.webview.postMessage(JSON.stringify({
          type: 'shape', dpr: (window.devicePixelRatio || 1),
          capsule: caps, band: band, caps: arcCaps, bandR: bandR, fabC: fabC, fabR: fabR,
          dbgPanelBox: [pb.left, pb.top, pb.right, pb.bottom],
          dbgArcBox: ab ? [ab.left, ab.top, ab.right, ab.bottom] : null,
          dbgBodyBg: getComputedStyle(document.body).backgroundColor,
          dbgDiscFill: (function () { try { return getComputedStyle(document.querySelector('.fab .disc circle')).fill; } catch (e) { return 'n/a'; } })(),
          dbgHit: (function () { try { return getComputedStyle(document.querySelector('.fab-hit')).backgroundColor; } catch (e) { return 'n/a'; } })()
        }));
      } catch (err) { }
    }
    if (document.readyState === 'complete') { requestAnimationFrame(butlerReportShape); }
    else { window.addEventListener('load', function () { requestAnimationFrame(butlerReportShape); }); }
  }
</script>
</body>
</html>
